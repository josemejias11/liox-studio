name: Validate

on:
  push:
    branches: [main, stg, dev]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moto_ai
          POSTGRES_PASSWORD: moto_ai
          POSTGRES_DB: moto_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://moto_ai:moto_ai@localhost:5432/moto_ai_ci
      DIRECT_URL: postgresql://moto_ai:moto_ai@localhost:5432/moto_ai_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --workspace=@moto-ai/scorm-export

  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/parser-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python -m compileall src
      - run: python -m unittest discover -s tests

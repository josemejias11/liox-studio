[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moto-parser"
version = "1.1.0"
description = "Moto AI internal document parsing, retrieval, chat, and quiz service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "langchain-chroma==1.1.0",
    "langchain-core==1.4.6",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.2",
    "markitdown[docx,pdf,pptx,xlsx]==0.1.6",
    "pydantic==2.13.4",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.32",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "ruff==0.8.4",
]

[project.scripts]
moto-parser = "moto_parser.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["moto_parser"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
# Strict mode subset — enable incrementally
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"

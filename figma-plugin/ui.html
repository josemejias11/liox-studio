<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f6f4f1;
    --surface: #ffffff;
    --ink: #16181d;
    --muted: #5f6678;
    --line: #d8dbe3;
    --accent: #685bc7;
    --accent-soft: #f2f0fb;
  }
  body {
    font-family: Inter, sans-serif;
    padding: 16px;
    background:
      radial-gradient(circle at top right, rgba(104, 91, 199, 0.12), transparent 34%),
      linear-gradient(180deg, #fbfaf8 0%, var(--bg) 100%);
    color: var(--ink);
  }
  h1 {
    font-size: 18px;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  p {
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted);
  }
  .panel {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    padding: 14px;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 32px rgba(19, 20, 23, 0.06);
  }
  .stack {
    display: grid;
    gap: 12px;
  }
  .grid-2 {
    display: grid;
    gap: 10px;
    grid-template-columns: 1fr 1fr;
  }
  .field {
    display: grid;
    gap: 6px;
  }
  .field label, .legend {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input[type="text"], input[type="number"], select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
  }
  textarea {
    width: 100%;
    min-height: 280px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    background: #fbfbfd;
    color: var(--ink);
    font-size: 12px;
    line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: vertical;
  }
  .checks {
    display: grid;
    gap: 8px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.68);
  }
  .check span {
    font-size: 12px;
    color: var(--ink);
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ghost {
    background: var(--accent-soft);
    color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #5e51be; }
  .ghost:hover { background: #e8e3fb; }
  button:disabled { background: #ccc; cursor: default; }
  .status { margin-top: 12px; font-size: 11px; color: #333; min-height: 15px; }
</style>

<div class="stack">
  <div class="panel stack">
    <div>
      <h1>Moto Board Generator</h1>
      <p>Generate only the board sections you need, with explicit sizing and cleanup controls.</p>
    </div>
    <div class="field">
      <label for="boardTitle">Board Title</label>
      <input id="boardTitle" type="text" value="Moto Tutor AI" />
    </div>
    <div class="grid-2">
      <div class="field">
        <label for="frameWidth">Frame Width</label>
        <input id="frameWidth" type="number" value="1920" min="320" step="10" />
      </div>
      <div class="field">
        <label for="frameHeight">Frame Height</label>
        <input id="frameHeight" type="number" value="1080" min="240" step="10" />
      </div>
    </div>
    <div class="field">
      <label for="frameGap">Gap Between Frames</label>
      <input id="frameGap" type="number" value="56" min="0" step="4" />
    </div>
    <div class="field">
      <label for="layoutMode">Layout Mode</label>
      <select id="layoutMode">
        <option value="inline">Single Page Inline Preview</option>
        <option value="per-page">One Figma Page Per Set</option>
      </select>
    </div>
  </div>

  <div class="panel stack">
    <div class="legend">Page Groups</div>
    <div class="checks">
      <label class="check"><input type="checkbox" name="page" value="overview" checked /> <span>Product Overview</span></label>
      <label class="check"><input type="checkbox" name="page" value="content" checked /> <span>Content & Authoring</span></label>
      <label class="check"><input type="checkbox" name="page" value="learner" checked /> <span>Learner Experience</span></label>
      <label class="check"><input type="checkbox" name="page" value="ai-analytics" checked /> <span>AI, Analytics & Outcomes</span></label>
    </div>
    <div class="meta" id="frameCount">11 frames selected.</div>
  </div>

  <div class="panel stack">
    <div class="legend">Output Options</div>
    <label class="check"><input id="clearExisting" type="checkbox" checked /> <span>Clear previously generated Moto pages first</span></label>
    <label class="check"><input id="includeScreenshots" type="checkbox" checked /> <span>Include screenshot placeholder zones</span></label>
    <label class="check"><input id="includeControlKit" type="checkbox" checked /> <span>Create the Moto Control Kit page too</span></label>
  </div>

  <div class="panel stack">
    <div>
      <div class="legend">Board Content JSON</div>
      <p>Edit the copy payload directly. The generator will render from this JSON and resend the whole board into Figma.</p>
    </div>
    <textarea id="contentJson"></textarea>
    <div class="actions">
      <button class="ghost" id="resetJson" type="button">Reset Template</button>
      <button class="ghost" id="formatJson" type="button">Format JSON</button>
    </div>
  </div>

  <button id="generate">Generate Board</button>
  <div class="status" id="status"></div>
</div>

<script>
  const btn = document.getElementById('generate');
  const status = document.getElementById('status');
  const boardTitle = document.getElementById('boardTitle');
  const frameWidth = document.getElementById('frameWidth');
  const frameHeight = document.getElementById('frameHeight');
  const frameGap = document.getElementById('frameGap');
  const layoutMode = document.getElementById('layoutMode');
  const clearExisting = document.getElementById('clearExisting');
  const includeScreenshots = document.getElementById('includeScreenshots');
  const includeControlKit = document.getElementById('includeControlKit');
  const frameCount = document.getElementById('frameCount');
  const contentJson = document.getElementById('contentJson');
  const resetJson = document.getElementById('resetJson');
  const formatJson = document.getElementById('formatJson');
  const pageChecks = Array.from(document.querySelectorAll('input[name="page"]'));
  let defaultContentJson = '';

  function selectedPages() {
    return pageChecks.filter((checkbox) => checkbox.checked).map((checkbox) => checkbox.value);
  }

  function updateFrameCount() {
    const counts = { overview: 2, content: 3, learner: 3, 'ai-analytics': 3 };
    const selected = selectedPages();
    const total = selected.reduce((sum, key) => sum + (counts[key] || 0), 0);
    frameCount.textContent = `${total} frame${total === 1 ? '' : 's'} selected.`;
  }

  pageChecks.forEach((checkbox) => checkbox.addEventListener('change', updateFrameCount));

  function validateJson() {
    try {
      JSON.parse(contentJson.value);
      contentJson.style.borderColor = 'var(--line)';
      return true;
    } catch (error) {
      contentJson.style.borderColor = '#d64045';
      status.textContent = `Invalid JSON: ${error.message}`;
      return false;
    }
  }

  btn.onclick = () => {
    const selected = selectedPages();
    if (selected.length === 0) {
      status.textContent = 'Select at least one page group.';
      return;
    }
    if (!validateJson()) return;
    btn.disabled = true;
    status.textContent = 'Generating...';
    parent.postMessage({
      pluginMessage: {
        type: 'generate',
        config: {
          boardTitle: boardTitle.value,
          frameWidth: Number(frameWidth.value),
          frameHeight: Number(frameHeight.value),
          frameGap: Number(frameGap.value),
          layoutMode: layoutMode.value,
          clearExisting: clearExisting.checked,
          includeScreenshots: includeScreenshots.checked,
          includeControlKit: includeControlKit.checked,
          selectedPages: selected,
        },
        contentJson: contentJson.value,
      },
    }, '*');
  };

  resetJson.onclick = () => {
    contentJson.value = defaultContentJson;
    contentJson.style.borderColor = 'var(--line)';
    status.textContent = '';
  };

  formatJson.onclick = () => {
    if (!validateJson()) return;
    contentJson.value = JSON.stringify(JSON.parse(contentJson.value), null, 2);
    status.textContent = 'Content JSON formatted.';
  };

  window.onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (msg.type === 'defaults' && msg.defaults) {
      boardTitle.value = msg.defaults.boardTitle;
      frameWidth.value = msg.defaults.frameWidth;
      frameHeight.value = msg.defaults.frameHeight;
      frameGap.value = msg.defaults.frameGap;
      layoutMode.value = msg.defaults.layoutMode || 'inline';
      clearExisting.checked = !!msg.defaults.clearExisting;
      includeScreenshots.checked = !!msg.defaults.includeScreenshots;
      includeControlKit.checked = !!msg.defaults.includeControlKit;
      pageChecks.forEach((checkbox) => {
        checkbox.checked = msg.defaults.selectedPages.includes(checkbox.value);
      });
      defaultContentJson = msg.contentJson || '{}';
      contentJson.value = defaultContentJson;
      updateFrameCount();
    }
    if (msg.type === 'done') {
      status.textContent = msg.text;
      btn.disabled = false;
    }
  };

  parent.postMessage({ pluginMessage: { type: 'get-defaults' } }, '*');
  updateFrameCount();
</script>
